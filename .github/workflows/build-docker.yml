name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=develop,enable=${{ github.ref_name == 'develop' }}
            type=sha,prefix=${{ github.ref_name }}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RAILS_ENV=production
            NODE_ENV=production
            SOURCE_COMMIT=${{ github.sha }}

      - name: Trigger Coolify deployment (develop)
        if: github.ref_name == 'develop'
        run: |
          curl -s -X POST "${{ secrets.COOLIFY_WEBHOOK_URL_DEV }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN_DEV }}" \
            -H "Content-Type: application/json"

      - name: Trigger Coolify deployment (production)
        if: github.ref_name == 'main'
        run: |
          curl -s -X POST "${{ secrets.COOLIFY_WEBHOOK_URL_PROD }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN_PROD }}" \
            -H "Content-Type: application/json"

      - name: Trigger Coolify deployment (production mono)
        if: github.ref_name == 'main'
        run: |
          curl -s -X POST "${{ secrets.COOLIFY_WEBHOOK_URL_PROD_MONO }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN_PROD_MONO }}" \
            -H "Content-Type: application/json"
